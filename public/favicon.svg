<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .frame { stroke: black; stroke-width: 5; fill: none; }
    .text { fill: black; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: white; }
      .text { fill: white; }
    }
  </style>
  
  <!-- Frame -->
  <path class="frame" d="M 20 40 L 80 40" />
  <path class="frame" d="M 220 40 L 280 40" />
  <path class="frame" d="M 20 40 L 20 120" />
  <path class="frame" d="M 280 40 L 280 120" />
  <path class="frame" d="M 20 120 L 70 120" />
  <path class="frame" d="M 230 120 L 280 120" />

  <!-- Text -->
  <g class="text">
    <text x="150" y="60" text-anchor="middle" font-family="serif" font-style="italic" font-size="55">Arte y</text>
    <text x="150" y="105" text-anchor="middle" font-family="serif" font-style="italic" font-size="60">Enmarcados</text>
    <text x="150" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">SOL Y SOMBRA SRL</text>
  </g>
</svg>

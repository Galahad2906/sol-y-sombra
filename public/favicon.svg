<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7E9" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="92" height="92" rx="16" fill="#111111"/>
  
  <!-- Outer Frame -->
  <rect x="18" y="18" width="64" height="64" rx="2" fill="none" stroke="url(#gold)" stroke-width="4"/>
  
  <!-- Inner Passepartout Line -->
  <rect x="25" y="25" width="50" height="50" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.7"/>

  <!-- Letter 'S' -->
  <text x="50" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="italic" font-weight="bold" fill="url(#gold)" text-anchor="middle">S</text>
</svg>
